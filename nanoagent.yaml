_ > nanoagent.plugin.v0001.ManifestConfig:
id: top-ncbi-cite
name: Top NCBI Cite
version: 0.1.1
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: [eutils.ncbi.nlm.nih.gov, icite.od.nih.gov]
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  top_cited_pubmed:
    description: Search PubMed in a publication-date window and return the PMID with the highest iCite citation count.
  pin_top_cited:
    description: Pin that same top-cited PMID before the task runs, as the answer key.

# One entry per contract.Task; its input and output classes are contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  top-cited-paper:
    description: Return the PMID of the most-cited PubMed paper in a publication-date window.
    runner: tool
    tools: [top_cited_pubmed]
    reference: pin_top_cited
    instructions: Call top_cited_pubmed once with the query and the inclusive publication-date window, and return that tool's pmid, citation_count, and papers_considered unchanged.
